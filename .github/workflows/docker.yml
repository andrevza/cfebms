name: Docker Hub

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test release source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify tag matches Home Assistant App version
        shell: bash
        run: |
          app_version=$(sed -n 's/^version: "\([^"]*\)"/\1/p' config.yaml)
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ -z "$app_version" || "$tag_version" != "$app_version" ]]; then
            echo "Release tag $GITHUB_REF_NAME must match config.yaml version $app_version" >&2
            exit 1
          fi

      - name: Run Docker test suite
        run: docker compose run --build --rm test

  publish:
    name: Publish multi-platform image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify Docker Hub username is configured
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: test -n "$DOCKERHUB_USERNAME"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Generate image tags and OCI labels
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/cfebms
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-3.0-only

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            BUILD_GIT_SHA=${{ github.sha }}
            BUILD_TIMESTAMP=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            BUILD_SOURCE_STATE=clean
          cache-from: type=gha,scope=cfebms
          cache-to: type=gha,mode=max,scope=cfebms
