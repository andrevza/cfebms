name: "CFE BMS"
slug: "cfe_bms"
description: "CFE Battery Management System"
version: "0.1.8"
url: "https://github.com/andrevza/cfebms"
startup: application
boot: auto
init: false
arch:
  - aarch64
  - amd64
options:
  cfe_battery_host: ""
  cfe_battery_port: 6868
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
schema:
  cfe_battery_host: str
  cfe_battery_port: "int(1,65535)"
  cfe_connect_timeout: "float(0.1,86400)?"
  cfe_read_timeout: "float(0.1,86400)?"
  cfe_reconnect_delay: "float(0.1,86400)?"
  cfe_stale_after: "float(0.1,86400)?"
  mqtt_host: str
  mqtt_port: "int(1,65535)"
  mqtt_username: "str?"
  mqtt_password: "password?"
  mqtt_discovery_prefix: "str?"
  mqtt_base_topic: "str?"
  log_level: "list(DEBUG|INFO|WARNING|ERROR|CRITICAL)?"
  heartbeat_log_interval_min: "int(0,10080)?"
