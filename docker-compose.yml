services:
  cfebms:
    build:
      context: .
      target: runtime
      args:
        BUILD_VERSION: ${BUILD_VERSION:-unknown}
        BUILD_ARCH: ${BUILD_ARCH:-unknown}
        BUILD_GIT_SHA: ${BUILD_GIT_SHA:-unknown}
        BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-unknown}
        BUILD_SOURCE_STATE: ${BUILD_SOURCE_STATE:-unknown}
    image: cfebms:local
    entrypoint: ["/run.sh"]
    command: ["service"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      CFE_BATTERY_HOST: ${CFE_BATTERY_HOST:-}
      CFE_BATTERY_PORT: ${CFE_BATTERY_PORT:-6868}
      MQTT_HOST: ${MQTT_HOST:-mqtt.example.com}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_DISCOVERY_PREFIX: ${MQTT_DISCOVERY_PREFIX:-homeassistant}
      MQTT_BASE_TOPIC: ${MQTT_BASE_TOPIC:-cfebms}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  test:
    build:
      context: .
      target: test
    command: ["-q"]
